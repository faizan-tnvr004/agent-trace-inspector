# One command start: `docker compose up --build`.
#
# The backend loads the committed corpus into SQLite on boot, so a reviewer with
# no setup knowledge gets a working system with data in it (NFR-4). No database
# service, no queue, no cache: the corpus is hundreds of runs.
#
# The load repeats whenever the corpus files change, not only on first boot. The
# volume below outlives `docker compose down`, so a database built from an
# earlier corpus would otherwise keep serving it.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Must be on the writable volume below, not under /app/data, which is
      # mounted read-only. Pointing it at the read-only mount makes the backend
      # fail at startup when it tries to create the database file.
      TRACE_DB_PATH: /app/var/traces.db
      CORPUS_DIR: /app/data/corpus
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      # Only needed to regenerate the corpus or rerun the study from inside the
      # container. Serving the committed corpus needs no API key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Read-only: the container serves the committed corpus and must not be
      # able to rewrite it.
      - ./data:/app/data:ro
      # The database is regenerated from the corpus on boot, so it lives in an
      # anonymous volume rather than on the read-only mount.
      - backend-db:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Reached from the browser, so it must be the host-published address, not
      # the compose service name.
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  backend-db:
